[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wmles_wrap"
version = "0.1.0"
description = "Compressible wall-modeled LES solver (multiblock explicit FV) in NVIDIA Warp"
requires-python = ">=3.10"
dependencies = ["warp-lang", "numpy", "pyvista", "pyyaml"]

[project.scripts]
wmles = "wmles_wrap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: long-running verification tests"]
